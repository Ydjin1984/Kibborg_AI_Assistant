# ============================================================
# KIBORG-FAST — профиль A, максимальный tok/s (контекст 128K)
# RTX 3090 24 GB = MODEL + COMPUTE + KV. RTX 3060 не участвует.
# Прод по умолчанию сейчас = KIBORG-LONG (256K). FAST — если нужна
# максимальная скорость генерации ценой окна контекста.
#
# Порядок устройств после свапа слотов совпадает с nvidia-smi:
#   CUDA0 = GPU 0 = RTX 3090 (24575 MiB)   <- мозг
#   CUDA1 = GPU 1 = RTX 3060 (12287 MiB)   <- простаивает
# После любых перестановок карт: llama-server --list-devices
#
# -sm none: одна карта, ноль PCIe-трафика между GPU.
# Бенч 26.08.2026 (128K, q8_0): decode ≈25.1 т/с, VRAM 3090≈23.6 ГБ.
#
# Применить: Stop -> скопировать LLAMA_* в settings.ini -> Start.
# ============================================================

LLAMA_DEVICE=CUDA0
LLAMA_SPLIT_MODE=none
LLAMA_TENSOR_SPLIT=
LLAMA_MAIN_GPU=
LLAMA_CTX_SIZE=131072
LLAMA_CACHE_TYPE_K=q8_0
LLAMA_CACHE_TYPE_V=q8_0
LLAMA_NO_KV_OFFLOAD=false
LLAMA_CTX_CHECKPOINTS=0
LLAMA_CACHE_RAM=0
LLAMA_BATCH=512
LLAMA_UBATCH=256
