# ============================================================
# KIBORG-LONG — профиль B, целевой под 256K (3090+3060)
# 3090 = MODEL + COMPUTE + основная часть KV.
# 3060 = хвост слоёв + свой кусок KV (дополнительная память).
# Цель: максимальный контекст без RAM offload (256K).
#
# llama.cpp не умеет «KV-only на второй карте»: кэш едет вместе
# со слоями. Поэтому B = layer-split с малым хвостом на 3060:
# 86% модели и основной KV — на 3090 (CUDA0),
# 14% слоёв с их KV — на 3060 (CUDA1).
#
# Бенч 26.08.2026 (Qwen3.8-27B-Q4_K_M + mmproj, PromptFrac 0.25):
#   128K: decode 23.6 т/с, VRAM 18.4+4.1 ГБ
#   256K: decode 19.4 т/с, VRAM 21.2+5.2 ГБ
# q8_0@256K тоже влезает (~24.2+5.7 ГБ, 17.4 т/с) — см. BENCH-LONG-Q8,
# но запас на 3090 почти нулевой.
#
# CTX_CHECKPOINTS=0 / CACHE_RAM=0 обязательны для гибридной
# Qwen3.8 (ggml-org/llama.cpp#22450).
# ============================================================

LLAMA_DEVICE=
LLAMA_SPLIT_MODE=layer
LLAMA_TENSOR_SPLIT=0.86,0.14
LLAMA_MAIN_GPU=0
LLAMA_CTX_SIZE=262144
LLAMA_CACHE_TYPE_K=q4_0
LLAMA_CACHE_TYPE_V=q4_0
LLAMA_NO_KV_OFFLOAD=false
LLAMA_CTX_CHECKPOINTS=0
LLAMA_CACHE_RAM=0
LLAMA_BATCH=512
LLAMA_UBATCH=256
